<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Классы рудника</title>
</head>
<body>
<h1>Настройка классов для рудника</h1>

<!-- Форма добавления нового класса -->
<form th:action="@{/designer/{id}/classes(id=${mineId})}" method="post">
    <label>Глобальный класс:</label>
    <select name="globalClassId">
        <option th:each="gc : ${globalClasses}" th:value="${gc.geologicalStabilityClassId}" th:text="${gc.geologicalStabilityClassCode}"></option>
    </select>

    <label>Локальный код (для рудника):</label>
    <input type="text" name="localCode" required placeholder="Например, 1">

    <button type="submit">Добавить класс</button>
</form>

<hr>

<!-- Таблица уже добавленных классов -->
<h2>Добавленные классы</h2>
<table border="1">
    <thead>
    <tr>
        <th>Локальный код</th>
        <th>Глобальный класс</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${classes}">
        <td th:text="${c.geologicalStabilityClassMineCode}"></td>
        <td th:text="${c.geologicalStabilityClass.geologicalStabilityClassCode}"></td>
        <td>
            <!-- Кнопка настройки свойств -->
            <a th:href="@{/designer/classes/{id}/properties(id=${c.geologicalStabilityClassMineId})}" class="btn">Настроить свойства</a>

            <!-- Кнопка удаления (через POST) -->
            <form th:action="@{/designer/{mineId}/classes/{classId}/delete(mineId=${mineId}, classId=${c.geologicalStabilityClassMineId})}" method="post" style="display:inline;">
                <button type="submit" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;" onclick="return confirm('Вы уверены, что хотите удалить класс? Все настроенные свойства для него тоже удалятся.')">
                    Удалить
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/designer}">Назад к выбору рудника</a>
</body>
</html>
