<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 100px; background: #f4f4f4;}
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #2a7ae2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1a5cb0; }
        .error { color: #c00; margin-bottom: 15px; font-size: 14px; }
        .logout { color: green; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="text-align: center;">Вход</h2>

    <!-- Сообщение об ошибке (если ввели неверный пароль) -->
    <div th:if="${param.error}" class="error">
        Неверный email или пароль
    </div>

    <!-- Сообщение при выходе из системы -->
    <div th:if="${param.logout}" class="logout">
        Вы успешно вышли из системы
    </div>

    <!-- Форма отправляет POST-запрос на /login (это перехватывает Spring Security) -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Логин:</label>
            <!-- Важно: name="username" обязателен для Spring Security! -->
            <input type="text" id="username" name="username" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit">Войти</button>
    </form>
    <!-- Поле зарегатся -->
    <div style="text-align: center; margin-top: 15px;">
        <a th:href="@{/register}" style="color: #2a7ae2; text-decoration: none; font-size: 14px;">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
</body>
</html>
