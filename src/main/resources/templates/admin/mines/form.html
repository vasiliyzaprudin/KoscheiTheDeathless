<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый рудник</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #c00; font-size: 0.9em; margin-top: 4px; }
        button { padding: 10px 20px; background: #2a7ae2; color: #fff; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;}
    </style>
</head>
<body>

<h1>Добавить рудник</h1>


<form th:action="@{/admin/mines}" th:object="${mineForm}" method="post">
    <div class="form-group">
        <label for="code">Код рудника:</label>
        <input type="text" id="code" th:field="*{code}" placeholder="MINE-01" required>
        <div class="error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
    </div>

    <div class="form-group">
        <label for="name">Название:</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Рудник Северный" required>
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="form-group">
        <label for="address">Адрес:</label>
        <input type="text" id="address" th:field="*{address}" placeholder="Область, город">
    </div>

    <div class="form-group">
        <label for="description">Описание:</label>
        <textarea id="description" th:field="*{description}" rows="4" placeholder="Медно-цинковый рудник"></textarea>
    </div>

    <button type="submit">Сохранить</button>
</form>

<div style="margin-top: 15px; text-align: center;">
    <a th:href="@{/admin/mines}" style="color: #2a7ae2; text-decoration: none;">← Назад к списку</a>
</div>

</body>
</html>
