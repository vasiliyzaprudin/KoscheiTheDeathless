<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .layout { display: flex; gap: 20px; align-items: flex-start; }

        /* Стили для левой панели (Форма) */
        .panel-form { flex: 0 0 400px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; position: sticky; top: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #c00; font-size: 12px; margin-top: 2px; display: none; }
        .has-error input, .has-error select { border-color: #c00; }
        .has-error .error { display: block; }

        /* Кнопки */
        .btn { display: inline-block; padding: 10px 15px; background: #2a7ae2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; text-align: center;}
        .btn:hover { background: #1e5cb3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        /* Стили для правой панели (Таблица) */
        .panel-list { flex: 1; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f4f4f4; position: sticky; top: 0; }
        tr:hover { background: #f1f1f1; }
        .role-badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; background: #e2e3e5; margin-bottom: 2px; }

        /* Сообщения */
        .msg-box { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 14px; }
        .msg-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .header-actions { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="header-actions">
    <h1>Управление пользователями</h1>
    <div>
        <a href="/admin/mines/list.html" class="btn btn-secondary">Управление рудниками</a>
        <a href="/admin/index.html" class="btn btn-secondary">На главную</a>
    </div>
</div>

<div class="layout">
    <!-- ЛЕВАЯ ПАНЕЛЬ: Форма создания/редактирования -->
    <div class="panel-form">
        <h2 id="formTitle" style="margin-top: 0;">Новый пользователь</h2>
        <div id="msgBox" class="msg-box"></div>

        <form id="userForm" novalidate>
            <input type="hidden" id="userId" value="">

            <div class="form-group" data-field="username">
                <label>Логин:</label>
                <input type="text" id="username" name="username" required>
                <div class="error"></div>
            </div>
            <div class="form-group" data-field="familiya">
                <label>Фамилия:</label>
                <input type="text" id="familiya" name="familiya" required>
                <div class="error"></div>
            </div>
            <div class="form-group" data-field="name">
                <label>Имя:</label>
                <input type="text" id="name" name="name" required>
                <div class="error"></div>
            </div>
            <div class="form-group" data-field="otchestvo">
                <label>Отчество:</label>
                <input type="text" id="otchestvo" name="otchestvo">
                <div class="error"></div>
            </div>
            <div class="form-group" data-field="email">
                <label>Email:</label>
                <input type="email" id="email" name="email" required>
                <div class="error"></div>
            </div>

            <!-- Поле пароля скрывается при редактировании -->
            <div class="form-group" data-field="password" id="passwordGroup">
                <label>Пароль:</label>
                <input type="password" id="password" name="password">
                <div class="error"></div>
            </div>

            <div class="form-group" data-field="roleId">
                <label>Должность:</label>
                <select id="roleId" name="roleId" required>
                    <option value="">— Выберите должность —</option>
                </select>
                <div class="error"></div>
            </div>

            <div class="form-group" data-field="mineId">
                <label>Организация (Рудник):</label>
                <select id="mineId" name="mineId">
                    <option value="">-- Управляющая компания (Холдинг) --</option>
                </select>
                <div class="error"></div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-success" style="flex: 1;">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()" id="cancelBtn" style="display: none;">Отмена</button>
            </div>
        </form>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ: Список пользователей -->
    <div class="panel-list">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>ФИО / Логин</th>
                <th>Роль и Рудник</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="usersBody">
            <tr><td colspan="5" style="text-align: center;">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/shared/js/api.js"></script>
<script>
    const USER_API = '/api/v1/users';
    let isEditMode = false;

    // === ИНИЦИАЛИЗАЦИЯ ===
    document.addEventListener('DOMContentLoaded', async () => {
        await loadDictionaries();
        await loadUsers();
    });

    // Загрузка ролей и рудников в выпадающие списки
    async function loadDictionaries() {
        try {
            const roles = await API.get('/api/v1/roles');
            const roleSelect = document.getElementById('roleId');
            roles.forEach(r => roleSelect.insertAdjacentHTML('beforeend', `<option value="${r.id}">${r.title}</option>`));

            const mines = await API.get('/api/admin/mines');
            const mineSelect = document.getElementById('mineId');
            mines.forEach(m => mineSelect.insertAdjacentHTML('beforeend', `<option value="${m.mineId}">${m.mineName}</option>`));
        } catch (e) {
            showMsg('Ошибка загрузки справочников: ' + e.message, true);
        }
    }

    // Загрузка списка пользователей
    async function loadUsers() {
        const tbody = document.getElementById('usersBody');
        try {
            const users = await API.get(USER_API);
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Нет пользователей</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            users.forEach(u => {
                const statusColor = u.enabled ? 'green' : 'orange';
                const statusText = u.enabled ? 'Активен' : 'Ожидает';

                // Кнопки: Утвердить (если неактивен), Редактировать, Блокировать (если активен)
                const approveBtn = !u.enabled ? `<button class="btn btn-sm btn-success" onclick="approveUser(${u.id})">✅ Утвердить</button>` : '';
                const blockBtn = u.enabled ? `<button class="btn btn-sm btn-danger" onclick="blockUser(${u.id})">🚫 Блок</button>` : '';

                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${u.id}</td>
                        <td>
                            <b>${u.familiya} ${u.name}</b><br>
                            <small style="color: #666;">@${u.username}</small>
                        </td>
                        <td>
                            ${Array.from(u.roleTitles).map(r => `<span class="role-badge">${r}</span>`).join(' ')}
                            <br><small style="color: #666;">${u.mineName}</small>
                        </td>
                        <td><span style="color: ${statusColor}; font-weight: bold;">${statusText}</span></td>
                        <td style="white-space: nowrap;">
                            ${approveBtn}
                            <button class="btn btn-sm" onclick="editUser(${u.id})">✏️ Ред.</button>
                            ${blockBtn}
                        </td>
                    </tr>
                `);
            });
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" style="color: red;">Ошибка: ${e.message}</td></tr>`;
        }
    }

    // === ОТПРАВКА ФОРМЫ ===
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const id = document.getElementById('userId').value;
        const payload = {
            username: document.getElementById('username').value.trim(),
            familiya: document.getElementById('familiya').value.trim(),
            name: document.getElementById('name').value.trim(),
            otchestvo: document.getElementById('otchestvo').value.trim(),
            email: document.getElementById('email').value.trim(),
            roleId: Number(document.getElementById('roleId').value),
            mineId: document.getElementById('mineId').value ? Number(document.getElementById('mineId').value) : null
        };

        if (!isEditMode) {
            payload.password = document.getElementById('password').value;
        }

        try {
            if (isEditMode) {
                await API.put(`${USER_API}/${id}`, payload);
                showMsg('Пользователь успешно обновлен!');
            } else {
                await API.post(USER_API, payload);
                showMsg('Пользователь успешно создан!');
            }
            resetForm();
            await loadUsers();
        } catch (e) {
            if (e.status === 400 && e.data && e.data.errors) {
                showFieldErrors(e.data.errors);
            } else if (e.status === 400 && e.data && e.data.message) {
                showMsg(e.data.message, true);
            } else {
                showMsg('Ошибка: ' + e.message, true);
            }
        }
    });

    // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===

    // Переход в режим редактирования
    async function editUser(id) {
        try {
            const u = await API.get(`${USER_API}/${id}`);

            document.getElementById('userId').value = u.id;
            document.getElementById('username').value = u.username;
            document.getElementById('familiya').value = u.familiya;
            document.getElementById('name').value = u.name;
            document.getElementById('otchestvo').value = u.otchestvo || '';
            document.getElementById('email').value = u.email;

            // Скрываем поле пароля
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('password').required = false;

            // Выбор роли (ищем по title, так как UserResponse отдает titles)
            const roleTitle = Array.from(u.roleTitles)[0];
            const roleSelect = document.getElementById('roleId');
            for(let opt of roleSelect.options) {
                if(opt.text === roleTitle) { roleSelect.value = opt.value; break; }
            }

            // Выбор рудника (ищем по name)
            const mineSelect = document.getElementById('mineId');
            for(let opt of mineSelect.options) {
                if(opt.text === u.mineName) { mineSelect.value = opt.value; break; }
            }

            // Меняем UI
            isEditMode = true;
            document.getElementById('formTitle').textContent = 'Редактировать: ' + u.username;
            document.getElementById('cancelBtn').style.display = 'block';

            // Прокрутка наверх на мобильных
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            alert('Ошибка загрузки: ' + e.message);
        }
    }

    // Сброс формы в режим создания
    function resetForm() {
        document.getElementById('userForm').reset();
        document.getElementById('userId').value = '';

        document.getElementById('passwordGroup').style.display = 'block';
        document.getElementById('password').required = true;

        isEditMode = false;
        document.getElementById('formTitle').textContent = 'Новый пользователь';
        document.getElementById('cancelBtn').style.display = 'none';
        clearErrors();
        document.getElementById('msgBox').style.display = 'none';
    }

    // Действия над пользователем
    async function approveUser(id) {
        if (!confirm('Утвердить регистрацию пользователя?')) return;
        try {
            await API.post(`${USER_API}/${id}/approve`, {});
            await loadUsers();
        } catch (e) { alert('Ошибка: ' + e.message); }
    }

    async function blockUser(id) {
        if (!confirm('Заблокировать пользователя? Он не сможет войти в систему.')) return;
        try {
            await API.delete(`${USER_API}/${id}`);
            await loadUsers();
        } catch (e) { alert('Ошибка: ' + e.message); }
    }

    // Утилиты для работы с ошибками
    function clearErrors() {
        document.querySelectorAll('.form-group').forEach(g => {
            g.classList.remove('has-error');
            g.querySelector('.error').textContent = '';
        });
    }

    function showFieldErrors(errors) {
        Object.entries(errors).forEach(([field, message]) => {
            const group = document.querySelector(`.form-group[data-field="${field}"]`);
            if (group) {
                group.classList.add('has-error');
                group.querySelector('.error').textContent = message;
            }
        });
    }

    function showMsg(text, isError = false) {
        const box = document.getElementById('msgBox');
        box.textContent = text;
        box.className = 'msg-box ' + (isError ? 'msg-error' : 'msg-success');
        box.style.display = 'block';
        setTimeout(() => { if(!isError) box.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
