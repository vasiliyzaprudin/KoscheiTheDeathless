<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление рудниками</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f4f4f4; }
        .btn { display: inline-block; padding: 8px 16px; background: #2a7ae2;
            color: #fff; text-decoration: none; border-radius: 4px; border: none;
            cursor: pointer; font-size: 14px; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-warning { background: #f0ad4e; }
        .btn-success { background: #28a745; }
        .empty { color: #888; font-style: italic; }
        .status-active { color: green; font-weight: bold; }
        .status-blocked { color: red; font-weight: bold; }
        .error { color: #c00; padding: 10px; background: #f8d7da; border-radius: 4px; }
    </style>
</head>
<body>

<h1>Управление рудниками</h1>

<div id="error" class="error" style="display:none;"></div>

<a class="btn" href="/admin/mines/creation.html">+ Создать рудник</a>
<a href="/admin/user/management.html" style="margin-left: 15px;">← К пользователям</a>

<table id="minesTable" style="display:none;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Код</th>
        <th>Название</th>
        <th>Адрес</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody id="minesBody"></tbody>
</table>

<p class="empty" id="emptyMessage" style="display:none;">Рудников пока нет. Создайте первый!</p>

<script src="/shared/js/api.js"></script>
<script>
    const API_URL = '/api/admin/mines';

    async function loadMines() {
        const errorBox = document.getElementById('error');
        errorBox.style.display = 'none';
        try {
            const mines = await API.get(API_URL);
            renderMines(mines);
        } catch (e) {
            errorBox.textContent = 'Не удалось загрузить список: ' + e.message;
            errorBox.style.display = 'block';
        }
    }

    function renderMines(mines) {
        const table = document.getElementById('minesTable');
        const body = document.getElementById('minesBody');
        const empty = document.getElementById('emptyMessage');
        body.innerHTML = '';

        if (!mines.length) {
            table.style.display = 'none';
            empty.style.display = 'block';
            return;
        }
        table.style.display = 'table';
        empty.style.display = 'none';

        for (const m of mines) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${m.mine_id}</td>
                <td>${escapeHtml(m.mine_code)}</td>
                <td>${escapeHtml(m.mine_name)}</td>
                <td>${escapeHtml(m.mine_address || '')}</td>
                <td>
                    <span class="${m.mine_enabled ? 'status-active' : 'status-blocked'}">
                        ${m.mine_enabled ? 'Активен' : 'Заблокирован'}
                    </span>
                </td>
                <td>
                    <a class="btn btn-sm" href="/admin/mines/edit.html?id=${m.mine_id}">✏️ Ред.</a>
                    <button class="btn btn-sm ${m.mine_enabled ? 'btn-warning' : 'btn-success'}"
                            data-id="${m.mine_id}">
                        ${m.mine_enabled ? '🔒 Блок.' : '🔓 Разблок.'}
                    </button>
                </td>
            `;
            tr.querySelector('button').addEventListener('click', () => toggleStatus(m.mine_id, m.mine_enabled));
            body.appendChild(tr);
        }
    }

    async function toggleStatus(id, currentlyEnabled) {
        const action = currentlyEnabled ? 'заблокировать' : 'разблокировать';
        if (!confirm(`Вы уверены, что хотите ${action} этот рудник?`)) return;
        try {
            await API.post(`${API_URL}/${id}/toggle`, {});
            await loadMines();
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    loadMines();
</script>

</body>
</html>
