<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сечение выработки (SVG + Клик)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; display: flex; gap: 20px; }
        .left-panel { flex: 1; }
        .right-panel { width: 300px; background: #f4f4f4; padding: 15px; border-radius: 8px; height: fit-content; }

        form { margin-bottom: 20px; }
        label { display: inline-block; width: 180px; }

        #svg-container {
            border: 1px solid #ccc;
            background: #fafafa;
            display: inline-block;
            cursor: default;
        }

        /* Интерактивность */
        #svg-container line,
        #svg-container path {
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        /* Подсветка при наведении (используем CSS-класс) */
        .highlight {
            stroke: #e63946 !important;
            stroke-width: 3 !important;
        }

        /* Стили для панели информации */
        .info-title { font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px;}
        .info-row { margin-bottom: 5px; font-size: 0.9em; }
        .info-label { color: #666; display: inline-block; width: 100px; }
        .info-value { font-weight: bold; }
    </style>
</head>
<body>

<div class="left-panel">
    <h2>Поперечное сечение (клик по элементу)</h2>

    <form id="params">
        <div><label>Ширина, м:</label><input name="width" type="number" step="0.1" value="4.0"></div>
        <div><label>Высота стенок, м:</label><input name="wallHeight" type="number" step="0.1" value="2.0"></div>
        <button type="submit">Построить</button>
    </form>

    <div id="svg-container"></div>
</div>

<div class="right-panel">
    <div class="info-title">Информация об элементе</div>
    <div id="element-info">
        <p style="color: #888; font-style: italic;">Кликните на любой элемент чертежа...</p>
    </div>
</div>

<script>
    const container = document.getElementById('svg-container');
    const infoPanel = document.getElementById('element-info');
    const SVG_NS = "http://www.w3.org/2000/svg";

    // Переменная для хранения текущего выделенного элемента
    let selectedElement = null;

    document.getElementById('params').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const width = parseFloat(fd.get('width'));
        const wallHeight = parseFloat(fd.get('wallHeight'));

        const url = `/api/drawing/geometry?width=${width}&wallHeight=${wallHeight}`;
        const resp = await fetch(url);
        if (!resp.ok) return;

        const model = await resp.json();
        drawModel(model);
        resetInfoPanel();
    });

    function resetInfoPanel() {
        infoPanel.innerHTML = '<p style="color: #888; font-style: italic;">Кликните на любой элемент чертежа...</p>';
        if (selectedElement) {
            selectedElement.classList.remove('highlight');
            selectedElement = null;
        }
    }

    function drawModel(model) {
        container.innerHTML = '';
        const canvasWidth = 800;
        const canvasHeight = 600;
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('width', canvasWidth);
        svg.setAttribute('height', canvasHeight);

        const padding = 40;
        const cw = canvasWidth - padding * 2;
        const ch = canvasHeight - padding * 2;
        const modelW = model.bounds.maxX - model.bounds.minX;
        const modelH = model.bounds.maxY - model.bounds.minY;
        const scale = Math.min(cw / modelW, ch / modelH);

        const offsetX = padding + (cw - modelW * scale) / 2 - model.bounds.minX * scale;
        const offsetY = padding + (ch - modelH * scale) / 2 - model.bounds.minY * scale;

        function toSvg(p) {
            return {
                x: offsetX + p.x * scale,
                y: canvasHeight - (offsetY + p.y * scale) // Инверсия Y
            };
        }

        for (const prim of model.primitives) {
            let element;

            if (prim.start && prim.end) {
                // --- Линия ---
                element = document.createElementNS(SVG_NS, 'line');
                const s = toSvg(prim.start);
                const e = toSvg(prim.end);
                element.setAttribute('x1', s.x);
                element.setAttribute('y1', s.y);
                element.setAttribute('x2', e.x);
                element.setAttribute('y2', e.y);

            } else if (prim.center && prim.radius !== undefined) {
                // --- Дуга ---
                const c = toSvg(prim.center);
                const r = prim.radius * scale;
                const startRad = (prim.startAngleDeg * Math.PI) / 180;
                const endRad = (prim.endAngleDeg * Math.PI) / 180;

                const spModel = { x: prim.center.x + prim.radius * Math.cos(startRad), y: prim.center.y + prim.radius * Math.sin(startRad) };
                const epModel = { x: prim.center.x + prim.radius * Math.cos(endRad), y: prim.center.y + prim.radius * Math.sin(endRad) };

                const sp = toSvg(spModel);
                const ep = toSvg(epModel);

                element = document.createElementNS(SVG_NS, 'path');
                const d = `M ${sp.x} ${sp.y} A ${r} ${r} 0 0 0 ${ep.x} ${ep.y}`;
                element.setAttribute('d', d);
                element.setAttribute('fill', 'none');
            }

            if (element) {
                // Применяем стили
                element.setAttribute('stroke', prim.style.stroke || '#000');
                element.setAttribute('stroke-width', prim.style.strokeWidth || 1);
                if (prim.style.strokeDasharray) {
                    element.setAttribute('stroke-dasharray', prim.style.strokeDasharray);
                }

                // ==========================================
                // НОВОЕ: Обработчики событий (Hover и Click)
                // ==========================================

                // 1. При наведении добавляем класс подсветки
                element.addEventListener('mouseenter', () => {
                    element.classList.add('highlight');
                });

                // 2. При уходе курсора убираем класс (если элемент не выбран кликом)
                element.addEventListener('mouseleave', () => {
                    if (element !== selectedElement) {
                        element.classList.remove('highlight');
                    }
                });

                // 3. При клике выводим информацию
                element.addEventListener('click', (event) => {
                    event.stopPropagation(); // Предотвращаем всплытие клика

                    // Снимаем выделение с предыдущего элемента
                    if (selectedElement) {
                        selectedElement.classList.remove('highlight');
                    }

                    // Выделяем текущий
                    selectedElement = element;
                    element.classList.add('highlight');

                    // Показываем информацию в панели
                    showElementInfo(prim);
                });

                svg.appendChild(element);
            }
        }
        container.appendChild(svg);
    }

    // ==========================================
    // Функция вывода информации о примитиве
    // ==========================================
    function showElementInfo(prim) {
        let html = '';

        html += `<div class="info-row"><span class="info-label">Роль:</span> <span class="info-value">${prim.role}</span></div>`;
        html += `<div class="info-row"><span class="info-label">ID:</span> <span style="font-size: 0.8em; color: #666;">${prim.id}</span></div>`;

        if (prim.start && prim.end) {
            // Для линий
            const dx = prim.end.x - prim.start.x;
            const dy = prim.end.y - prim.start.y;
            const length = Math.sqrt(dx * dx + dy * dy);

            html += `<div class="info-row"><span class="info-label">Тип:</span> <span class="info-value">Линия</span></div>`;
            html += `<div class="info-row"><span class="info-label">Начало:</span> <span class="info-value">(${prim.start.x}, ${prim.start.y})</span></div>`;
            html += `<div class="info-row"><span class="info-label">Конец:</span> <span class="info-value">(${prim.end.x}, ${prim.end.y})</span></div>`;
            html += `<div class="info-row"><span class="info-label">Длина:</span> <span class="info-value">${length.toFixed(2)}</span></div>`;

        } else if (prim.center && prim.radius !== undefined) {
            // Для дуг
            html += `<div class="info-row"><span class="info-label">Тип:</span> <span class="info-value">Дуга</span></div>`;
            html += `<div class="info-row"><span class="info-label">Центр:</span> <span class="info-value">(${prim.center.x}, ${prim.center.y})</span></div>`;
            html += `<div class="info-row"><span class="info-label">Радиус:</span> <span class="info-value">${prim.radius}</span></div>`;
            html += `<div class="info-row"><span class="info-label">Углы:</span> <span class="info-value">${prim.startAngleDeg}° — ${prim.endAngleDeg}°</span></div>`;
        }

        infoPanel.innerHTML = html;
    }

    // Клик по пустому месту (вне SVG) сбрасывает выделение
    document.addEventListener('click', (e) => {
        if (!container.contains(e.target)) {
            resetInfoPanel();
        }
    });
</script>
</body>
</html>
