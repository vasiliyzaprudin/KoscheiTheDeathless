<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сечение выработки (Модульный JS)</title>
    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="/css/drawing.css">
</head>
<body>

<div class="left-panel">
    <h2>Поперечное сечение (клик по элементу)</h2>

    <form id="params">
        <div><label>Ширина, м:</label><input name="width" type="number" step="0.1" value="4.0"></div>
        <div><label>Высота стенок, м:</label><input name="wallHeight" type="number" step="0.1" value="2.0"></div>
        <button type="submit">Построить</button>
    </form>

    <div style="margin-bottom: 15px;">
        <button type="button" id="btn-export-png">Скачать PNG</button>
        <div style="margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 5px;">
            <label for="description" style="display: block; margin-bottom: 5px; font-weight: bold;">
                Описание процесса возведения крепи:
            </label>
            <textarea id="description" rows="5" style="width: 100%; box-sizing: border-box; resize: vertical;"
                      placeholder="Введите текст описания..."></textarea>

            <button type="button" id="btn-generate-pdf" style="margin-top: 10px; background: #d32f2f; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
                Сформировать отчет (PDF)
            </button>
        </div>
        <button type="button" id="btn-reset-zoom">Сбросить зум</button>
    </div>

    <div id="svg-container"></div>
</div>

<div class="right-panel">
    <div class="info-title">Информация</div>
    <div id="element-info">
        <p style="color: #888; font-style: italic;">Кликните на любой элемент чертежа...</p>
    </div>
</div>

<!-- Подключаем JS как модуль -->
<script type="module" src="/js/main.js"></script>

</body>
</html>
